name: Build Manager Data AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.7/bin >> "$GITHUB_PATH"
      - name: Confirm Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          echo "Android SDK: $ANDROID_HOME"
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: manager-data-ai-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
